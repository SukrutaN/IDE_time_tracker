<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>IDE Time Tracker</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 350px;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    
    h1 {
      font-size: 20px;
      margin-bottom: 20px;
      text-align: center;
    }
    
    .status {
      background: rgba(255, 255, 255, 0.2);
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 15px;
      backdrop-filter: blur(10px);
    }
    
    .status-item {
      display: flex;
      justify-content: space-between;
      margin: 10px 0;
      font-size: 14px;
    }
    
    .status-label {
      opacity: 0.9;
    }
    
    .status-value {
      font-weight: bold;
      font-size: 16px;
    }
    
    .progress-bar {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 4px;
      overflow: hidden;
      margin-top: 10px;
    }
    
    .progress-fill {
      height: 100%;
      background: #4ade80;
      transition: width 0.3s ease;
    }
    
    .blocked-sites {
      background: rgba(255, 255, 255, 0.2);
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 15px;
    }
    
    .blocked-sites h2 {
      font-size: 14px;
      margin-bottom: 10px;
      opacity: 0.9;
    }
    
    .site-list {
      font-size: 12px;
      line-height: 1.6;
      opacity: 0.8;
    }
    
    .actions {
      display: flex;
      gap: 10px;
    }
    
    button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.9);
      color: #667eea;
      transition: all 0.2s;
    }
    
    button:hover {
      background: white;
      transform: translateY(-1px);
    }
    
    button:active {
      transform: translateY(0);
    }
    
    .reset-btn {
      background: rgba(239, 68, 68, 0.9);
      color: white;
    }
    
    .reset-btn:hover {
      background: rgba(239, 68, 68, 1);
    }
    
    .error {
      background: rgba(239, 68, 68, 0.2);
      padding: 10px;
      border-radius: 6px;
      font-size: 12px;
      margin-bottom: 15px;
      text-align: center;
    }
    
    .loading {
      text-align: center;
      padding: 20px;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <h1>⏰ IDE Time Tracker</h1>
  
  <div id="content">
    <div class="loading">Loading...</div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
